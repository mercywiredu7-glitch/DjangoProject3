{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-3">
            <!-- Sidebar content -->
        </div>

        <div class="col-md-9">
            <div class="hero-section text-center p-5 mb-4 rounded-3 shadow-sm">
                <img src="{% static 'images/logo.png' %}" alt="Shop Logo" class="shop-logo mb-3">
                <h1 class="fw-bold">Welcome to <span class="highlight">ReggieMercy Shop</span></h1>
                <p class="lead">Your one-stop destination for all your shopping needs.</p>
                {% if not user.is_authenticated %}
                <a class="btn btn-primary btn-lg" href="{% url 'register' %}">Get Started</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
